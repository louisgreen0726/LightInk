ed."
  findings:
    - "P2[advisory]: src/reader/reader.css:75 | root cause: 后代选择器 .lightink-reader-text-layer span/br 把 position absolute 施加到 wrapTextRangeWithSpan 插入的搜索 overlay span，该类规则未重置 position（pdfjs 官方 .appended 约定需 position initial） | refs: src/reader/search-panel.ts; node_modules/pdfjs-dist/web/pdf_viewer.css | impact: 命中片段移出文档流后同 div 内其后透明文本左移错位，搜索 overlay 存续期间命中后文字选择/光标映射偏移一个命中宽度；持久数据无损 | minimal fix: .lightink-reader-search-mark(--current) 规则补 position initial 并补样式回归断言"
    - "P3: src/reader/reader-view.ts:703 | root cause: 跳转/首搜激活到尚未懒渲染页时 renderPdfSearchMarks 因层缺失跳过，层随后经 observer 重建走不滚动路径，当前命中的页内 scrollIntoView 永不执行 | refs: src/reader/reader-view.ts:785,865,884 | impact: 页高超过视口时当前命中可能停留视口外，只见页级跳转 | minimal fix: observer 恢复路径区分当前命中首次揭示，补一次 scrollIntoView"
    - "P3: src/reader/reader-view.ts:1234 | root cause: 搜索面板容器 Escape 只 preventDefault 不 stopPropagation，事件冒泡到 root 键盘处理器 | refs: src/reader/search-panel.ts:141-152; src/reader/reader-view.ts root keydown | impact: 侧栏可见时按一次 Escape 同时关闭搜索面板与标注侧栏 | minimal fix: 面板 Escape 补 stopPropagation 或 root 处理器先查搜索面板"
