[package]
name = "lightink"
version = "0.1.4"
description = "轻墨 LightInk - A lightweight Markdown editor"
authors = ["LightInk"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "lightink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

# T11: release binary size/performance tuning. `lto` + a single codegen unit
# favour smaller/faster binaries at the cost of longer release compiles;
# `opt-level = "s"` prioritises installer size (a stated R13 outcome);
# `strip` removes symbols from the shipped binary (debug info is not needed
# in the installer; keep debug builds untouched for development).
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
