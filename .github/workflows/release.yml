name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以提取变更记录

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 自动提取变更记录：取上一个 tag 到当前 tag 之间的提交，按
      # conventional commit 前缀分组（feat/fix/其他），注入 releaseBody。
      - name: Generate changelog from commits
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            SINCE="自 ${PREV_TAG}"
          else
            RANGE="${GITHUB_REF_NAME}"
            SINCE="首个发布"
          fi

          FEATS=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -E '^- (feat|perf)(\(|:)' || true)
          FIXES=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -E '^- fix(\(|:)' || true)
          OTHERS=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -vE '^- (feat|fix|perf)(\(|:)' || true)

          {
            echo "RELEASE_BODY<<EOF"
            echo "本版本变更（${SINCE}）："
            echo ""
            if [ -n "$FEATS" ]; then echo "### 新特性"; echo "$FEATS"; echo ""; fi
            if [ -n "$FIXES" ]; then echo "### 修复"; echo "$FIXES"; echo ""; fi
            if [ -n "$OTHERS" ]; then echo "### 其他"; echo "$OTHERS"; echo ""; fi
            echo "---"
            echo "Windows: NSIS/MSI 安装包；macOS: DMG（Apple Silicon）；Linux: deb/AppImage。"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LightInk ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
