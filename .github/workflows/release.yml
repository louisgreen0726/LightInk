name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要完整历史以提取变更记录
          filter: blob:none  # 历史只取 commit/tree，当前版本文件按需下载

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true  # 失败重跑（同 tag）可复用已编译依赖

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 自动提取变更记录：取上一个 tag 到当前 tag 之间的提交，按
      # conventional commit 前缀分组（feat/fix/其他），注入 releaseBody。
      - name: Generate changelog from commits
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            SINCE="自 ${PREV_TAG}"
          else
            RANGE="${GITHUB_REF_NAME}"
            SINCE="首个发布"
          fi

          FEATS=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -E '^- (feat|perf)(\(|:)' || true)
          FIXES=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -E '^- fix(\(|:)' || true)
          OTHERS=$(git log "$RANGE" --pretty=format:'- %s' --no-merges | grep -vE '^- (feat|fix|perf)(\(|:)' || true)

          {
            echo "RELEASE_BODY<<EOF"
            echo "本版本变更（${SINCE}）："
            echo ""
            if [ -n "$FEATS" ]; then echo "### 新特性"; echo "$FEATS"; echo ""; fi
            if [ -n "$FIXES" ]; then echo "### 修复"; echo "$FIXES"; echo ""; fi
            if [ -n "$OTHERS" ]; then echo "### 其他"; echo "$OTHERS"; echo ""; fi
            echo "---"
            echo "Windows: NSIS/MSI 安装包；macOS: DMG（Apple Silicon）；Linux: deb/AppImage。"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # WiX 3.14 的 light.exe 在 ICE 校验阶段依赖 VBScript（Windows Script Host）。
      # Windows 11 24H2 / Server 2025 起 VBScript 从可选功能（feature）迁移为
      # 按需功能（FoD capability），`dism /enable-feature` 会报 0x800f080c
      # "Feature name VBSCRIPT is unknown"。这里自动发现 capability 名称
      # （如 VBSCRIPT~~~~0.0.1.0），并兼容旧镜像的可选功能形态。
      # 参考：https://github.com/tauri-apps/tauri/issues/13752
      - name: Enable VBScript for WiX MSI bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name 'VBSCRIPT*' | Select-Object -First 1
          if ($cap) {
            Write-Host "VBScript capability: $($cap.Name) state=$($cap.State)"
            if ($cap.State -ne 'Installed') {
              Add-WindowsCapability -Online -Name $cap.Name
            }
          } else {
            $feat = Get-WindowsOptionalFeature -Online -FeatureName 'VBSCRIPT' -ErrorAction SilentlyContinue
            if ($feat) {
              Write-Host "VBScript optional feature state=$($feat.State)"
              if ($feat.State -ne 'Enabled') {
                Enable-WindowsOptionalFeature -Online -FeatureName 'VBSCRIPT' -NoRestart | Out-Null
              }
            } else {
              Write-Error 'VBScript is neither a capability nor an optional feature on this image.'
              exit 1
            }
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LightInk ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: --target ${{ matrix.target }}

  verify-release:
    name: Verify release assets
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Require all platform installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].name')
          echo "$ASSETS"

          for PATTERN in '\.msi$' '\.exe$' '\.dmg$' '\.deb$' '\.AppImage$'; do
            if ! grep -Eq "$PATTERN" <<< "$ASSETS"; then
              echo "::error::Release ${GITHUB_REF_NAME} is missing an asset matching ${PATTERN}"
              exit 1
            fi
          done
